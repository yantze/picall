name: Local research
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --workspaces=false
      - run: npm run check:local
      - run: npm run test:tools
      - run: npm run test:local
      - run: npm run test:package
