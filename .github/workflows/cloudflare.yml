name: Cloudflare Agent Search
on:
  push:
    branches: [Cloudflare]
  pull_request:
    branches: [Cloudflare]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
